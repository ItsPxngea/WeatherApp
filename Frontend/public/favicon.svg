<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark instrument panel background -->
  <circle cx="32" cy="32" r="31" fill="#12181f"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#3a4655" stroke-width="1.5"/>

  <!-- Outer dial ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2a3542" stroke-width="2"/>

  <!-- Tick marks around the gauge -->
  <g stroke="#5a6b7d" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="56" y2="32"/>
    <line x1="15.5" y1="15.5" x2="18.3" y2="18.3"/>
    <line x1="45.7" y1="45.7" x2="48.5" y2="48.5"/>
    <line x1="48.5" y1="15.5" x2="45.7" y2="18.3"/>
    <line x1="18.3" y1="45.7" x2="15.5" y2="48.5"/>
  </g>

  <!-- Sun -->
  <circle cx="27" cy="27" r="7" fill="#f5b942"/>

  <!-- Cloud, overlapping sun bottom-right -->
  <path d="M20 38
           a6 6 0 0 1 1-11.9
           a7.5 7.5 0 0 1 14.5 2.4
           a5.5 5.5 0 0 1 -1 10.5
           z"
        fill="#dfe6ee"/>

  <!-- Gauge needle, pointing to upper-right (fair weather) -->
  <line x1="32" y1="32" x2="44" y2="22" stroke="#e8563f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="#e8563f"/>
</svg>
